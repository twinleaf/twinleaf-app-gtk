[package]
name = "twinleaf-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GTK4 user interface for the Twinleaf app."
default-run = "twinleaf-gtk"

[features]
default = []
hdf5 = ["twinleaf-core/hdf5"]

[dependencies]
twinleaf-core = { path = "../twinleaf-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"
async-channel = "2"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[build-dependencies]
glib-build-tools = "0.20"
