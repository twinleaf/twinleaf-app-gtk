# Flatpak manifest for twinleaf-gtk. Build/install:
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flatpak/com.twinleaf.AppGtk.yaml
#
# For a reproducible OFFLINE build, generate cargo-sources.json with
# flatpak-cargo-generator (flatpak-builder-tools) from Cargo.lock, add it to the
# `sources:` list, and remove the `build-args: --share=network` below.
id: com.twinleaf.AppGtk
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: twinleaf-gtk
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network          # mDNS discovery, TCP devices, firmware catalog
  - --device=all             # USB / serial device access
modules:
  - name: twinleaf-gtk
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/twinleaf-gtk/cargo
      build-args:
        - --share=network    # remove once cargo-sources.json is provided
    build-commands:
      - cargo build --release --locked -p twinleaf-gtk
      - install -Dm755 target/release/twinleaf-gtk /app/bin/twinleaf-gtk
      - install -Dm644 packaging/linux/com.twinleaf.AppGtk.desktop
        /app/share/applications/com.twinleaf.AppGtk.desktop
      # (1024px stays in the repo for the macOS .icns but exceeds Flatpak's
      # 512x512 export limit, so it is not installed here.)
      - for s in 16 32 64 128 256 512; do
        install -Dm644 packaging/linux/icons/hicolor/${s}x${s}/apps/com.twinleaf.AppGtk.png
        /app/share/icons/hicolor/${s}x${s}/apps/com.twinleaf.AppGtk.png; done
      - install -Dm644 packaging/linux/com.twinleaf.AppGtk.metainfo.xml
        /app/share/metainfo/com.twinleaf.AppGtk.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          # Keep local build state out of the source copy (target/ alone can
          # be multiple GB after a native build).
          - target
          - .flatpak-builder
          - build-dir
          - vendor/twinleaf-rust/target
